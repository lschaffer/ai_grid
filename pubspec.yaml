name: ai_grid
description: "An intelligent DataGrid for Flutter with native AI assistant and MCP skill control."
version: 0.13.0
repository: https://github.com/lschaffer/ai_grid
issue_tracker: https://github.com/lschaffer/ai_grid/issues
topics:
  - datagrid
  - ai
  - mcp
  - table
  - agent

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  fitgrid_plus:
    path: ../fitgrid_plus
  material_ui: ^1.8.0
  intl: ^0.20.2
  dart_mcp_core: ^1.4.0
  draggable_overlay_window: ^1.1.1
  file_saver: ^0.7.0
  shared_preferences: ^2.5.6
  file_picker: ^13.1.0
  http: ^1.6.0
  yaml: ^3.1.4
  archive: ^4.5.2
  xml: ^7.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
